# Tmux config

# Use C-a instead
unbind C-b
set -g prefix C-a
bind a send-prefix

bind r source-file ~/.tmux.conf \; display-message "tmux configuration reloaded"

# base settings
set-option -g default-shell /bin/zsh
set-option -g mouse on
set -s escape-time 0
set -g status-interval 1
set -g default-terminal "tmux-256color"
set -as terminal-features ',xterm-256color:RGB'
set -g focus-events on
setw -g aggressive-resize on

# Support for shift-enter
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'
bind-key -n S-Enter send-keys -l "\e[13;2u"

# set 1 as base index for numbering
set-option -g base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set -g status "on"
set -g status-left ''
set -g status-right '#{prefix_highlight}'
set -g status-bg "#3c3836"
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#a89984,bg=#3c3836] #I | #W "
setw -g window-status-current-format "#[fg=#282828,bg=#a89984] #I | #W "
set -g @prefix_highlight_fg '#282828'
set -g @prefix_highlight_bg '#a89984'
set -g message-style fg="#a89984",bg="#4c3836"

# Vim-tmux pane navigation (manual bindings instead of TPM plugin for faster is_vim check).
# pgrep is ~3-8x faster than ps|grep on macOS, eliminating the ~1s delay when leaving vim.
is_vim="tty=#{pane_tty} ; pgrep -t \${tty#/dev/} 'g?(view|n?vim?x?)(diff)?$' >/dev/null 2>&1"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind-key -n 'C-Space' if-shell "$is_vim" 'send-keys C-Space' 'select-pane -t:.+'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-Space' select-pane -t:.+

# Pane styling
set -g pane-border-style fg=#504945
set -g pane-active-border-style fg=#fabd2f
set -g pane-border-lines heavy
set -g pane-border-indicators arrows
# Inactive panes: muted fg + dimmer bg. Active: explicit bright fg (fg=default
# often stays dim in tmux); bg matches main Gruvbox dark bg.
set -g window-style 'fg=#928374,bg=#32302f'
set -g window-active-style 'fg=#ebdbb2,bg=#282828'

# Dim status bar and panes when terminal loses focus
set-hook -g client-focus-out 'set status-bg "#1d2021"; set window-active-style "fg=#928374,bg=#32302f"; set pane-active-border-style fg=#504945'
set-hook -g client-focus-in 'set status-bg "#3c3836"; set window-active-style "fg=#ebdbb2,bg=#282828"; set pane-active-border-style fg=#fabd2f'

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# initialize tmux plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
